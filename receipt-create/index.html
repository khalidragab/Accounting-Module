<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Create Receipt</title><link rel="stylesheet" href="../assets/style.css"><script src="../assets/app.js"></script></head><body><div class="app" id="app"><div class="content"><header class="top"><div>Receivables / Create Receipt</div><div class="user">KR</div></header><main class="page"><div class="heading"><div><div class="eyebrow">CUSTOMER RECEIVABLES</div><h1>Create Customer Receipt</h1><div class="muted">Record and allocate a customer payment.</div></div><div class="actions"><a class="btn" href="../receipts/">Back to Search</a><button class="btn">Save Draft</button><button class="btn primary" id="submit">Submit</button></div></div><div class="grid"><div class="stack"><section class="card pad"><h2>Receipt Information</h2><div class="fields"><div class="field"><label>Business Unit *</label><select><option>UAQ Real Estate</option></select></div><div class="field"><label>Receipt Type *</label><select><option>Standard Receipt</option><option>Advance Receipt</option></select></div><div class="field"><label>Receipt Date *</label><input type="date" value="2026-10-27"></div><div class="field"><label>Currency *</label><select><option>AED</option></select></div><div class="field span2"><label>Customer *</label><input value="Ahmed Mohammed"></div><div class="field"><label>Payment Method *</label><select><option>Bank Transfer</option><option>Cheque</option></select></div><div class="field"><label>Reference *</label><input value="TRX-20261027-4581"></div></div></section><section class="card pad"><h2>Property & Contract</h2><div class="fields"><div class="field"><label>Project</label><select><option>Al Seef Residence</option></select></div><div class="field"><label>Building</label><select><option>Tower A</option></select></div><div class="field"><label>Unit</label><select><option>A-1205</option></select></div><div class="field"><label>Contract / SPA</label><select><option>SPA-2026-00841</option></select></div></div></section><section class="card pad"><h2>Invoice Allocation</h2><div class="fields"><div class="field span2"><label>Invoice</label><select><option>INV-2026-001245 - AED 202,100</option></select></div><div class="field"><label>Receipt Amount *</label><input id="receipt" type="number" value="202100"></div><div class="field"><label>Apply Amount *</label><input id="apply" type="number" value="202100"></div></div></section></div><aside><section class="card pad summary"><h2>Receipt Summary</h2><div class="row"><span>Receipt</span><b id="rt"></b></div><div class="row"><span>Applied</span><b id="ap"></b></div><div class="row total"><span>Unapplied</span><strong id="un"></strong></div><div class="toast" id="msg"></div></section></aside></div></main></div></div><script>app.insertAdjacentHTML('afterbegin',nav('receipt-create'));function calc(){let r=+receipt.value||0,a=Math.min(r,+apply.value||0);rt.textContent=money(r);ap.textContent=money(a);un.textContent=money(r-a)}receipt.oninput=apply.oninput=calc;submit.onclick=()=>msg.textContent='Receipt is ready for validation and approval.';calc();</script></body></html>
