<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Users</title><link rel="stylesheet" href="../assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/supabase-config.js"></script><script src="../assets/app.js"></script><script defer src="../assets/auth.js"></script></head><body><div class="app" id="app"><div class="content"><header class="top"><b>User Administration</b><button class="btn" onclick="signOut()">Sign out</button></header><main class="page"><h1>Users</h1><p class="muted">Create authentication users in Supabase Authentication, then maintain their ERP profile and role here.</p><section class="card"><div class="table-wrap"><table><thead><tr><th>User Code</th><th>Name</th><th>Email</th><th>Role</th><th>Active</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div></div><script>app.insertAdjacentHTML('afterbegin',nav());document.addEventListener('erp-ready',async()=>{const {data}=await erp.from('user_profiles').select('*,roles(name)');rows.innerHTML=(data||[]).map(x=>`<tr><td><b>${x.user_code}</b></td><td>${x.full_name}</td><td>${x.email}</td><td>${x.roles?.name||''}</td><td>${x.active?'Yes':'No'}</td></tr>`).join('')})</script></body></html>
