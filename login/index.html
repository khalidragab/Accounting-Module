<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ERP Login</title><link rel="stylesheet" href="../assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/supabase-config.js"></script></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><section class="card pad" style="width:min(420px,100%)"><h1>Accounting ERP</h1><p class="muted">Sign in with your authorized account.</p><form id="f"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" required></div><button class="btn primary" style="width:100%;margin-top:15px">Sign in</button></form><div id="msg"></div></section></main><script>const c=ERP_CONFIG,ok=!c.supabaseUrl.includes('YOUR_PROJECT'),client=ok?supabase.createClient(c.supabaseUrl,c.supabaseAnonKey):null;if(!ok)msg.innerHTML='<div class="notice err">Configure config/supabase-config.js first.</div>';f.onsubmit=async e=>{e.preventDefault();const {error}=await client.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.innerHTML='<div class="notice err">'+error.message+'</div>';else location.href='../dashboard/'}</script></body></html>
